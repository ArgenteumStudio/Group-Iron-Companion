plugins {
    id 'java'
}

def runeliteRoot = 'C:/Users/John/Desktop/java/runelite'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files("$runeliteRoot/runelite-api/build/libs/runelite-api-1.12.24-SNAPSHOT.jar")
    compileOnly files("$runeliteRoot/runelite-client/build/libs/client-1.12.24-SNAPSHOT.jar")
    compileOnly 'com.google.inject:guice:4.1.0'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.slf4j:slf4j-api:1.7.25'
    compileOnly 'com.google.guava:guava:31.1-jre'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

sourceSets {
    main {
        java {
            srcDirs = ["$runeliteRoot/runelite-client/src/main/java/net/runelite/client/plugins/bowlsofmayo"]
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

jar {
    archiveFileName = 'bowlsofmayo.jar'
}
